  const legs=path.slice(1).map(([x,y],i)=>({a:path[i],b:[x,y],length:Math.hypot(x-path[i][0],y-path[i][1])}));
  const distance=legs.reduce((sum,leg)=>sum+leg.length,0);
  const colors=[[.82,.31,.21],[.23,.51,.70],[.69,.64,.47],[.55,.20,.33],[.78,.79,.70]];
  const random=i=>((Math.sin(i*159.47+2.33)*7563.419)%1+1)%1;
  const mix=(a,b,t)=>a+(b-a)*t;
  const smooth=t=>t*t*(3-2*t);
  const loop=25,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let elapsed=reduced?8:0,running=!reduced,last=null;
  const button=$('pause');
  if(!running)button.textContent='Reproduzir';
  function runtime(now){
    if(running&&last!==null)elapsed=(elapsed+(now-last)/1000)%loop;
    last=running?now:null;
    const t=elapsed,night=smooth(Math.max(0,Math.min(1,(t-16)/5)));
    const day=(.68+.32*smooth(Math.min(1,t/6)))*(1-.64*night);
    const scale=Math.min(devicePixelRatio||1,1.6),width=Math.max(1,Math.round(canvas.clientWidth*scale)),height=Math.max(1,Math.round(canvas.clientHeight*scale));
    if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
    const aspect=width/height, camera=smooth(Math.min(1,t/10)), approach=smooth(Math.max(0,Math.min(1,(t-10)/8)));
    const target=[mix(6.8,4.15,camera),mix(1.45,-.38,approach),.4];
    const yaw=mix(-.35,.20,camera),pitch=mix(.73,.60,approach);
    const co=Math.cos(yaw),si=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    const right=[co,si,0],up=[-si*sp,co*sp,cp],forward=[-si*cp,co*cp,-sp];
    const zoom=mix(4.7,4.04,approach)/Math.min(1,aspect*1.24);
    gl.viewport(0,0,width,height);
    gl.clearColor(mix(.23,.025,night),mix(.35,.052,night),mix(.47,.101,night),1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    for(const [key,value] of Object.entries({target,right,up,forward}))gl.uniform3fv(u[key],value);
    gl.uniform1f(u.aspect,aspect);gl.uniform1f(u.zoom,zoom);gl.uniform1f(u.daylight,day);
    draw(buffers.site,meshes.site.length/9);
    draw(fixedBuffer,fixed.length/9);
    const spin=-t*.43;
    draw(buffers.wheel,meshes.wheel.length/9,spin,night*.22);
    const moving=[],light=[];
    for(let i=0;i<12;i++){
      const direction=i%2?1:-1,speed=.52+random(i)*.51;
      const x=-10+((random(i+32)*20+direction*speed*t)%20+20)%20;
      const y=-1.29+(direction*.145),angle=direction===1?0:Math.PI;
      box(moving,x,y,.232,.30,.112,.069,colors[i%colors.length],angle);
      box(moving,x-.017*direction,y,.284,.15,.096,.046,[.28,.46,.52],angle);
      for(const dx of [-.098,.098])for(const dy of [-.057,.057])
        box(moving,x+dx,y+dy,.199,.058,.021,.047,[.05,.06,.07],t*speed*5);
      if(night>.35)for(const dy of [-.036,.036])box(light,x+.153*direction,y+dy,.236,.016,.019,.016,[.88,.85,.52]);
    }
    for(let i=0;i<27;i++){
      const direction=i%2?1:-1,x=-5+((random(i+205)*14+direction*(.11+random(i+4)*.15)*t)%14+14)%14;
      const y=-1.78+random(i+21)*.22, stride=.022*Math.sin(t*8+i);
      box(moving,x,y,.273,.041,.049,.082,colors[i%colors.length]);
      box(moving,x,y,.333,.034,.036,.035,[.68,.47,.36]);
      for(const side of [-1,1])box(moving,x+stride*side,y+side*.013,.216,.017,.016,.057,[.14,.17,.21]);
    }
    for(let i=0;i<25;i++){
      const x=2.65+random(i+346)*2.1,y=-2.56-random(i+301)*.23,z=.13+.014*Math.sin(t*5+i);
      box(moving,x,y,z,.041,.042,.080,colors[(i+1)%colors.length]);
      box(moving,x,y,z+.055,.030,.031,.032,[.69,.52,.39]);
    }
    if(t>20){
      const x=3.65+.14*Math.sin(t*3.2),bounce=.016*Math.sin(t*6.4);
      box(moving,x,-2.47,.33+bounce,.057,.040,.10,[.81,.50,.25]);
      box(moving,x,-2.47,.405+bounce,.040,.036,.042,[.72,.46,.32]);
      for(const side of [-1,1])box(moving,x+side*.054,-2.47,.35+bounce,.061,.018,.022,[.72,.46,.32],side*Math.sin(t*5)*.7);
    }
    function dynamicDraw(out,glow=0){
      if(!out.length)return;
      gl.bindBuffer(gl.ARRAY_BUFFER,dynamic);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(out),gl.DYNAMIC_DRAW);draw(dynamic,out.length/9,0,glow);
    }
    dynamicDraw(moving);
    let remain=distance*smooth(Math.max(0,Math.min(1,(t-2)/8))),tip=path[0];
    for(const {a,b,length} of legs){
      if(remain<=0)break;
      const progress=Math.min(1,remain/length);
      tip=[mix(a[0],b[0],progress),mix(a[1],b[1],progress)];
      box(light,(a[0]+tip[0])/2,(a[1]+tip[1])/2,.237,length*progress,.047,.032,[1,.65,.18],Math.atan2(b[1]-a[1],b[0]-a[0]));
      remain-=length;
    }
    if(night>.1){
      for(let i=0;i<44;i++){
        const a=i*Math.PI/22-spin,k=(Math.sin(t*4+i*.31)+1)/2;
        box(light,5.96+Math.cos(a)*1.04,-2.14,1.44+Math.sin(a)*1.04,.05,.036,.05,[.26+k*.61,.48+k*.36,1-k*.30]);
      }
      for(let i=0;i<7;i++)box(light,2.95+i*.23,-2.74,1.05,.10,.035,.039,[.35+.59*random(i+4),.40,.86]);
      box(light,3.65,-2.13,.54,.70,.04,.40,[.39+.22*Math.sin(t*4),.24,.69]);
      if(t>21){
        const burst=(t-21)%1.35;
        for(let i=0;i<15;i++){const a=i*Math.PI*2/15;box(light,4.0+Math.cos(a)*burst*.58,-2.5,2.75+Math.sin(a)*burst*.58,.026,.026,.026,[1,.46,.26]);}
      }
    }
    dynamicDraw(light,.22+night*.69);
    gl.depthMask(false);draw(buffers.context,meshes.context.length/9,0,0,.26);gl.depthMask(true);
    const q=[tip[0]-target[0],tip[1]-target[1],.27-target[2]];
    const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
    const label=$('walk');
    label.hidden=t<2.3||t>17.5;
    label.style.left=Math.max(25,Math.min(75,50+50*dot(q,right)/(zoom*aspect)))+'%';
    label.style.top=Math.max(28,Math.min(85,50-50*dot(q,up)/zoom))+'%';
    const hour=Math.floor(6+t*18/25);
    $('clock').textContent=(t<6?'Amanhecer':t<16?'Tarde':t<21?'Anoitecer':'Réveillon')+' · '+String(hour).padStart(2,'0')+'h';
    if(running)requestAnimationFrame(runtime);
  }
  button.onclick=()=>{
    running=!running;last=null;
    button.textContent=running?'Pausar':'Continuar';
    if(running)requestAnimationFrame(runtime);
  };
  $('replay').onclick=()=>{
    elapsed=0;
    if(!running){running=true;last=null;button.textContent='Pausar';requestAnimationFrame(runtime);}
  };
  addEventListener('resize',()=>{if(!running)runtime(performance.now());});
  runtime(performance.now());
}
</script>
</html>
