async function start(){
  const decode=async payload=>{
    const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));
    return Float32Array.from(new Int16Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()), value=>value/256);
  };
  const meshes=Object.fromEntries(await Promise.all(Object.entries(packed).map(async([key,data])=>[key,await decode(data)])));
  function compile(type,code){
    const shader=gl.createShader(type);gl.shaderSource(shader,code);gl.compileShader(shader);
    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));

  varying vec3 color;

    const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
    const label=$('walk');
