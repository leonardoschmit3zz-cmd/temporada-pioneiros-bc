 function shader(type,code){const sh=gl.createShader(type);gl.shaderSource(sh,code);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh;}

 gl.attachShader(p,shader(gl.VERTEX_SHADER,`
 attribute vec3 position,normal,diffuse;
 uniform vec3 eye,forward,right,up;
 uniform float aspect,focal;
 varying vec3 color;
 varying float distanceToCamera;
 void main(){
   vec3 q=position-eye; float depth=dot(q,forward);
   gl_Position=vec4(dot(q,right)*focal/aspect,dot(q,up)*focal,depth*1.001-.28,depth);
   float light=.74+.32*max(0.,dot(normal,normalize(vec3(-.45,-.69,.64))));
   color=pow(clamp(diffuse*light,0.,1.),vec3(.63));
   distanceToCamera=depth;
 }`));
 gl.attachShader(p,shader(gl.FRAGMENT_SHADER,`
 precision mediump float;
 varying vec3 color;
 varying float distanceToCamera;
 void main(){gl_FragColor=vec4(mix(color,vec3(.65,.76,.84),smoothstep(75.,330.,distanceToCamera)*.47),1.);}
 `));
 gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.useProgram(p);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);
 for(const [i,key] of ['position','normal','diffuse'].entries()){
   const loc=gl.getAttribLocation(p,key);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,36,12*i);
 }
 const u=Object.fromEntries(['eye','forward','right','up','aspect','focal'].map(k=>[k,gl.getUniformLocation(p,k)]));
 const unit=v=>{const m=Math.hypot(...v);return v.map(x=>x/m)};
 const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
 let t=0,last=null,pan=0,drag=null,running=!matchMedia('(prefers-reduced-motion: reduce)').matches,auto=running;
 if(!running)pause.textContent='Reproduzir';
 gl.enable(gl.DEPTH_TEST);
 function frame(now){
   if(running&&last!==null)t+=Math.min(.10,(now-last)/1000);
   last=running?now:null;
   if(t>=22&&auto){location.replace(aerial.href);return;}
   t=Math.min(t,22);
   const progress=t/22,x=-17+94*progress;
   const eye=[x,-3.85-.00125*Math.max(0,x-60)**2,2.0+progress*.9];
   const angle=.32-.39*progress+pan;
   const forward=unit([Math.cos(angle),Math.sin(angle),.115]);
   const right=unit(cross(forward,[0,0,1])),up=cross(right,forward);
   const dpr=Math.min(devicePixelRatio||1,1.5);
   const w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
   if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
   gl.viewport(0,0,w,h);gl.clearColor(.64,.76,.85,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   for(const [key,value] of Object.entries({eye,forward,right,up}))gl.uniform3fv(u[key],value);
   gl.uniform1f(u.aspect,w/h);gl.uniform1f(u.focal,1.25*Math.min(1,w/h*1.35));
   gl.drawArrays(gl.TRIANGLES,0,count);
   by('place').textContent=t<5?'Edifício Mar Azul':t<14?'Rua Miguel Matte · edificações da rua':'Rumo à roda-gigante';
   if(running)requestAnimationFrame(frame);
 }
 pause.onclick=()=>{running=!running;auto=false;last=null;pause.textContent=running?'Pausar':'Continuar';if(running)requestAnimationFrame(frame);};
 by('replay').onclick=()=>{t=0;pan=0;last=null;if(!running){running=true;pause.textContent='Pausar';requestAnimationFrame(frame);}auto=true;};
 canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;auto=false;drag=e.clientX;canvas.setPointerCapture(e.pointerId);});
 canvas.addEventListener('pointermove',e=>{if(drag===null)return;pan+=(drag-e.clientX)*.006;drag=e.clientX;if(!running)frame(performance.now());});
 for(const key of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(key,()=>{drag=null;});
 addEventListener('resize',()=>{if(!running)frame(performance.now());});
 status.hidden=true;
 frame(performance.now());
}
